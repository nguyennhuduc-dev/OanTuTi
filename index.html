<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Siêu Cấp Oẳn Tù Tì - Prime Edition</title>
    <link rel="stylesheet" href="style.css">
    <!-- Nhúng Font chữ điện tử từ Google Fonts -->
    <link href="https://googleapis.com" rel="stylesheet">
</head>
<body>
    <div class="game-container">
        <h1>OẲN TÙ TÌ</h1>
        
        <!-- Bảng điểm phong cách Esport Premium -->
        <div class="score-board">
            <div class="score-card">
                <span class="score-label">Bạn</span>
                <span id="player-score" class="score-number">0</span>
            </div>
            <div class="vs-badge">VS</div>
            <div class="score-card">
                <span class="score-label">Máy</span>
                <span id="computer-score" class="score-number">0</span>
            </div>
        </div>

        <!-- Sàn đấu mô phỏng Hologram kỹ thuật số -->
        <div class="battle-ground">
            <div class="choice-display">
                <p>Lựa chọn của bạn</p>
                <div id="player-choice-icon" class="status-emoji">❓</div>
            </div>
            <div class="choice-display">
                <p>Lựa chọn của Máy</p>
                <div id="computer-choice-icon" class="status-emoji">❓</div>
            </div>
        </div>

        <!-- Hộp thông báo trạng thái kết quả trận đấu -->
        <div class="result-message">
            <p id="game-status">CHỌN VŨ KHÍ ĐỂ KÍCH HOẠT HỆ THỐNG!</p>
        </div>

        <!-- Khu vực các nút bấm hành động Prime phát sáng -->
        <div class="action-buttons">
            <button class="btn" id="rock" data-choice="rock">
                <span class="btn-emoji">✊</span> Búa
            </button>
            <button class="btn" id="paper" data-choice="paper">
                <span class="btn-emoji">✋</span> Bao
            </button>
            <button class="btn" id="scissors" data-choice="scissors">
                <span class="btn-emoji">✌️</span> Kéo
            </button>
        </div>
        
        <!-- Nút chơi lại để reset điểm số -->
        <button id="reset-btn" class="reset-button">Khởi động lại hệ thống</button>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
